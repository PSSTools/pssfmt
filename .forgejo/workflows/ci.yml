# psstools/pssfmt -- Forgejo Actions.
#
# THIS FILE'S FIRST JOB IS TO EXIST.
#
# When .forgejo/workflows/ is absent the Forgejo runner FALLS BACK to running
# .github/workflows/. That is measured on this instance, not assumed:
# action_run.workflow_directory records runs that did exactly that, and
# psstools/pssfmt is one of the repos it happened to.
#
# Adding this file SHADOWS the .github one -- precedence is first-directory-found,
# evaluated per commit -- so the GitHub workflow can no longer be executed by a
# runner it was never written for.
#
# WHY THIS IS A CHECK RATHER THAN A MIRROR OF THE GITHUB WORKFLOW
# ---------------------------------------------------------------
# The GitHub side is a Python test matrix built on actions/setup-python, which is not available on a Forgejo runner.
# A shadow that pretended to reproduce it would go red for reasons that are
# about the runner rather than the code, and people would stop reading it. So
# this runs the checks that ARE meaningful here.
#
# ⚠️ Shadowing does NOT protect the inbound path. Precedence is evaluated
# against the INCOMING tree, so a ref pulled from GitHub that lacks
# .forgejo/workflows/ still falls back to .github/. pull_publish = "block" and
# the publish_risk() preflight are what hold that side; this file is not a
# substitute for either.
#
# RELEASES (2026-09-28). `gate` and `publish-pypi` below are the Forgejo half
# of the pair in .github/workflows/ci.yml: the same release-authority switch,
# compared against 'forgejo' instead of 'github'. Today the switch names GitHub
# for this repo, so publish-pypi SKIPS here on every tag. It exists so that
# moving pssfmt's releases to Forgejo is a sync-policy.toml edit and not a
# workflow edit. It builds inside the publish job, on a tag only, so a branch
# push still does no network build here (see `check` below).
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    # Release master switch -- see .github/workflows/ci.yml for the reasoning.
    # One-line python on purpose (a multi-line body breaks the YAML block
    # scalar); case-folded because the switch's keys are lowercase.
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
    - id: resolve
      run: |
        url=https://dvkit.org/.well-known/release-authority.json
        if ! body=$(curl -fsS --max-time 10 "$url"); then
          case "$GITHUB_REF" in
            refs/tags/v*)
              echo "::error::release-authority switch unreachable; refusing to publish"
              exit 1 ;;
            *)
              echo "authority=none" >> "$GITHUB_OUTPUT"
              echo "switch unreachable on a non-tag ref; nothing to release"
              exit 0 ;;
          esac
        fi
        auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"].lower(); print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
        echo "release authority for $GITHUB_REPOSITORY: $auth"
        echo "authority=$auth" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check for internal identifiers in tracked files
      # This repo is published to git.dvkit.org, so anything committed here is
      # public. Internal host names, tailnet addresses and CGNAT-range IPs must
      # not appear in tracked files -- if a build ever needs one, it belongs in
      # a repository secret, which is masked in logs.
      #
      # THE PATHSPEC EXCLUDES THE WHOLE DIRECTORY, not just this file, and the
      # difference is not cosmetic. Excluding only `ci.yml` worked exactly as
      # long as this was the only workflow here; docs.yml landed beside it on
      # 2026-09-08 carrying its own copy of this very pattern, and each file
      # would then match the OTHER's -- turning both jobs red for quoting the
      # thing they are looking for. That is what happened to pssparser when
      # conformance.yml landed, and to four edapack repos in wave 3a.
      run: |
        pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
        if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/' ; then
          echo "::error::internal identifier found in a tracked file (see matches above)"
          exit 1
        fi
        echo "OK: no internal identifiers in tracked files"

    - name: Static-check the packaging metadata
      # Deliberately does not execute the build: that is what the GitHub side
      # is for, and running it here would pull dependencies over the network on
      # every push.
      #
      # tomllib IS NOT AVAILABLE HERE. It is stdlib from Python 3.11, and
      # `ubuntu-latest` on this runner maps to catthehacker/ubuntu:act-22.04,
      # whose python3 is 3.10 -- so the bare `import tomllib` this step used to
      # open with raised ModuleNotFoundError and failed the job on EVERY run
      # since the workflow landed. Same defect as commit 81e6209 fixed on the
      # GitHub side for the 3.9 and 3.10 matrix legs; this copy was written
      # from the template and never got it.
      #
      # tomli is the documented backport and is API-compatible, but it is not
      # in the image either and installing it would put this step on the
      # network -- which is the one thing the comment above says it must not
      # do. So the last resort is a line scan. That is NOT a TOML parser and
      # is not pretending to be one: this step's job is to notice that the
      # metadata is readable and says what it should, and on 3.10 a scan that
      # finds `name` and `version` under [project] establishes exactly that.
      run: |
        if [ -f pyproject.toml ]; then
          python3 - <<'PY'
        try:
            import tomllib
        except ModuleNotFoundError:
            try:
                import tomli as tomllib
            except ModuleNotFoundError:
                tomllib = None

        if tomllib is not None:
            with open("pyproject.toml", "rb") as f:
                p = tomllib.load(f).get("project", {})
            name, version = p.get("name"), p.get("version")
            how = "parsed"
        else:
            # Bounded to the [project] table so a `name =` under
            # [tool.something] cannot be mistaken for the package name.
            import re
            body = re.split(r"^\[", open("pyproject.toml").read(), flags=re.M)
            tbl = next((t for t in body if t.startswith("project]")), "")
            def field(k):
                m = re.search(rf'^{k}\s*=\s*"([^"]+)"', tbl, re.M)
                return m.group(1) if m else None
            name, version = field("name"), field("version")
            how = "scanned (no tomllib on this interpreter)"

        print(f"pyproject ({how}): {name} {version}")
        if not name:
            raise SystemExit("::error::pyproject.toml declares no [project] name")
        PY
        elif [ -f setup.py ]; then
          python3 -c "import ast; ast.parse(open('setup.py').read()); print('setup.py parses')"
        elif [ -f package.json ]; then
          python3 -c "import json; d=json.load(open('package.json')); print('package.json:', d.get('name'), d.get('version'))"
        else
          echo "no packaging metadata; nothing to check"
        fi

  publish-pypi:
    # A TAG, and the switch naming THIS forge. Skips -- does not fail -- when
    # the switch names GitHub. Runner constraints: python3 is 3.10 with a pip
    # that predates PEP 660, and no third-party actions -- so venvs and plain
    # twine.
    if: startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'forgejo'
    needs: [gate, check]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build sdist and wheel
      run: |
        python3 -m venv /tmp/buildenv
        /tmp/buildenv/bin/pip install -q --upgrade pip build twine
        rm -rf dist/
        /tmp/buildenv/bin/python -m build .
        /tmp/buildenv/bin/twine check dist/*
        ls -la dist/

    - name: Test against the built wheel
      # The corpus-free suites only: the corpus sweeps fail (not skip) without
      # a pss-corpus checkout, and the full matrix is the GitHub side's job.
      # This proves the wheel installs, its console script runs, and the
      # layout engine works from it.
      run: |
        python3 -m venv /tmp/testenv
        /tmp/testenv/bin/pip install -q --upgrade pip
        /tmp/testenv/bin/pip install -q "pytest>=8.0" "$(ls dist/*.whl)"
        /tmp/testenv/bin/pssfmt --version
        /tmp/testenv/bin/python -m pytest -q -m "layout or unit or trivia"

    - name: Check the tag IS the version
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        base=$(python3 -c "import re; print(re.search(r'^_pkg_version = \"([^\"]*)\"$', open('src/pssfmt/__version__.py').read(), re.M).group(1))")
        echo "tag=$tag  source=$base"
        if [ "$tag" != "$base" ]; then
          echo "::error::tag v$tag does not match version $base in src/pssfmt/__version__.py"
          exit 1
        fi
        for f in dist/*; do
          case "$(basename "$f")" in
            pssfmt-${base}-*.whl|pssfmt-${base}.tar.gz) ;;
            *) echo "::error::artifact $(basename "$f") is not version ${base}"; exit 1 ;;
          esac
        done
        echo "OK: tag, source version and every artifact agree on ${base}"

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "::error::PYPI_API_TOKEN is not visible to this repository"
          exit 1
        fi
        /tmp/buildenv/bin/twine upload --non-interactive --skip-existing dist/*
