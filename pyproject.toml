[build-system]
# 77, not 68: `license = "Apache-2.0"` is a PEP 639 license expression only
# from setuptools 77. Older versions accept the same line as free text and emit
# `License:` instead of `License-Expression:`, so the floor is what makes a
# rebuild from the sdist produce the same metadata as the released wheel.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pssfmt"
description = "A formatter for the Accellera Portable Test and Stimulus Standard (PSS)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Matthew Ballance", email = "matt.ballance@gmail.com" },
]
keywords = ["pss", "accellera", "formatter", "verification", "eda"]
classifiers = [
    # Alpha, not Pre-Alpha: the pipeline is complete end to end and carries a
    # checked safety contract, but the rule set is deliberately partial and
    # constructs are still being added, which is what Beta would claim is done.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Filters",
]
# pssfmt calls pssparser's tokenizer on every file it formats, so this is a
# real runtime dependency and not an optional one.
#
# The floor is 3.0.6, and it is a floor for a specific reason rather than for
# recency: `pssparser.tokens` -- the lex-without-parse token stream pssfmt is
# built on -- does not exist in 3.0.2, the newest release on PyPI at the time
# this line was first written. `pip install pssfmt` against 3.0.2 fails at
# import with ModuleNotFoundError, so the version pin is what turns that into a
# resolver error a user can read.
#
# 3.0.6, not 3.0.4: 3.0.4 and 3.0.5 exist as versions on PyPI but carry **no
# files** -- no wheel, no sdist -- so `>=3.0.4` and `>=3.0.6` resolve to exactly
# the same thing today. Naming the version that can actually be installed is
# what keeps the comment above true; a floor pip cannot satisfy is a floor that
# documents nothing.
#
# That made a pssparser release the gate on publishing pssfmt. **Closed
# 2026-08-31**: 3.0.6 is on PyPI with cp39-cp314 manylinux wheels, so this line
# resolves and the documented `pip install pssfmt` is a promise the index can
# keep. Building from a checkout is unaffected -- ivpm resolves pssparser from
# git, and the documented editable install passes --no-deps for exactly that
# reason.
#
# Wheels only, no sdist: an interpreter or platform with no matching wheel
# fails at install time rather than falling back to a source build that needs
# ANTLR and a C++ toolchain. That is the better failure, and CI's matrix is
# what keeps the supported set honest.
#
# Everything under src/pssfmt/layout/ works with no dependency at all, by
# design (formatter.md section 10.3, enforced by T-9).
#
# `tomli` is the one entry, and it is a backport rather than a dependency:
# `pssfmt.config` reads `.pssfmt` and `[tool.pssfmt]` as TOML, which is stdlib
# `tomllib` from 3.11 and needs the backport on the two older interpreters
# this package still supports. It is not imported unless a configuration file
# is actually found, and T-9's zero-dependency promise covers
# `src/pssfmt/layout/`, which does not reach it.
dependencies = [
    "pssparser>=3.0.6",
    "tomli>=1.1.0; python_version < '3.11'",
]
dynamic = ["version"]

[project.optional-dependencies]
# `tomli` reads the corpus's manifest.toml (pss-corpus PLAN.md C-9) on the two
# interpreters where `tomllib` is not stdlib. Not a runtime dependency: nothing
# under src/ reads TOML, and the layout engine's zero-dependency promise (T-9)
# is unaffected by what the test extra pulls in.
test = ["pytest>=8.0", "tomli>=1.1.0; python_version < '3.11'"]
# `pygments-pss` is not a nicety here: docs/conf.py registers `sphinx_pss` only
# when it is importable, and without a `pss` lexer every `.. code-block:: pss`
# raises "Pygments lexer name 'pss' is not known" -- which `sphinx-build -W`
# (T-10, D-16) turns into a failed build. The extra has to carry whatever makes
# the documented build command succeed, and this is that. sphinx-pss itself is
# an ivpm dev dependency and is not on PyPI, so it stays optional.
docs = ["sphinx>=7.0", "myst-parser", "furo", "pygments-pss>=0.1.0"]

[project.scripts]
# `run`, not `main`: main returns an exit code so that tests can drive the real
# entry point rather than a testable copy of it, and console_scripts treats a
# non-None return value as an error *message*. `run` is the two-line shim that
# turns the code into sys.exit.
pssfmt = "pssfmt.cli:run"

[project.urls]
# No Source URL: git.dvkit.org serves git clones, not browsable pages, and a
# released version's metadata can never be edited -- a dead link would be
# permanent. Add one when there is a public mirror. (Same call as pygments-pss.)
Homepage = "https://accellera.org/downloads/standards/portable-stimulus"

[tool.setuptools.dynamic]
version = { attr = "pssfmt.__version__._pkg_version" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pssfmt = ["py.typed"]
