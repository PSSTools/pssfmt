[pytest]
# Mirrors pssparser/pytest.ini (PLAN.md T-1). --strict-config and
# --strict-markers together mean a typo in a marker name or an ini key is an
# error, not a silently-ignored line.

python_files = test_*.py
python_classes = Test*
python_functions = test_*

minversion = 8.0

testpaths = tests

addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals

markers =
    unit: fast, no corpus, no pssparser
    layout: layout engine only; must pass with pssparser absent (P2, T-2)
    trivia: comment-attachment rules (T-3)
    corpus: sweeps over the PSS corpus (T-4, T-5)
    property: property/fuzz oracles -- no hand-authored expected output (T-8, T-11)
    golden: input/expected file pairs; the only suite with authoring cost (T-6)
    cli: command-line behaviour (T-7)
    integration: crosses a repo or process boundary
    slow: deselect with -m "not slow"
